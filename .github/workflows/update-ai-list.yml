name: Update AI list

on:
  schedule:
    # 每天 UTC 04:00（北京时间 12:00）自动更新
    - cron: "0 4 * * *"
  workflow_dispatch: # 也支持手动触发（Actions 页面点 Run workflow）

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate ai.list
        run: python3 scripts/update_ai_list.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- config/mihomo/config/ai.list; then
            git add config/mihomo/config/ai.list
            git commit -m "chore: update ai.list [skip ci]"
            git push origin HEAD:main
            echo "ai.list 已更新"
          else
            echo "无变化，跳过"
          fi
